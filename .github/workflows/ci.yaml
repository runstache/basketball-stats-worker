name: UNIT TESTS
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-packages
      - name: Run Tests
        run: uv run --frozen pytest

  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-packages
      - name: Run MyPy
        run: uv run --frozen  mypy .
      - name: Run Ruff Checks
        run: uvx ruff check --fix
      - name: Ruff Linting
        run: uvx ruff format
    needs:
      - test